<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הזמנת אוכל</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            position: relative;
        }
        h1 {
            color: #d9534f;
            text-align: center;
            margin-bottom: 10px;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            font-size: 16px;
            color: #555;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .header-image {
            width: 100%;
            height: auto;
            max-height: 220px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none; /* מוסתר כברירת מחדל בזמן בדיקת זמינות */
        }
        .form-group {
            margin-bottom: 20px;
        }
        label.section-label {
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 5px;
        }
        input[type="text"], input[type="email"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .radio-item, .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .btn-submit {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #c9302c;
        }
        .btn-submit:disabled, fieldset:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            opacity: 0.7;
        }
        #closed-message {
            display: block;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8d7da;
            color: #721c24;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }
        #confirmationScreen {
            display: none;
            text-align: center;
            padding: 20px 10px;
        }
        #confirmationScreen h2 {
            color: #28a745;
            font-size: 24px;
            margin-bottom: 15px;
        }
        #confirmationScreen p {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn-new-order {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        #adminPanel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 320px;
            border: 2px solid #333;
        }
        #adminPanel h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
        }
        .admin-section {
            margin-bottom: 15px;
        }
        .admin-section label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-admin-action {
            background-color: #0275d8;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            margin-top: 5px;
        }
        .btn-admin-export {
            background-color: #5cb85c;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }
        .close-admin {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        #newUserGroup {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="formScreen">
        <h1 id="mainTitle">ברוכים הבאים להזמנה שלנו!</h1>
        <div class="subtitle" id="providerSubtitle">היום המזון מגיע מ...</div>

        <!-- תמונה מתחלפת דינמית (נשארת מוסתרת עד טעינת הנתונים) -->
        <img id="headerImg" alt="אוכל" class="header-image">

        <div id="closed-message">
            ⏳ בודק זמינות מערכת...
        </div>

        <form id="shawarmaForm">
            <fieldset id="formFields" disabled>
                <!-- שם המזמין -->
                <div class="form-group">
                    <label for="userSelect" class="section-label">שם המזמין:</label>
                    <select id="userSelect" required>
                        <option value="">-- בחר שם מהרשימה או צור חדש --</option>
                        <option value="NEW_USER">+ משתמש חדש (הכנס שם חדש)</option>
                    </select>

                    <div id="newUserGroup">
                        <input type="text" id="newUserName" placeholder="הכנס שם מלא חדש">
                    </div>
                </div>

                <!-- סוג הלחם / הגשה (מוצג רק בשווארמה) -->
                <div class="form-group" id="breadFormGroup">
                    <label class="section-label" id="breadLabel">סוג הלחם / הגשה:</label>
                    <div class="options-group" id="breadOptionsGroup"></div>
                </div>

                <!-- סוג המנה / החומוס / הבשר -->
                <div class="form-group">
                    <label class="section-label" id="meatLabel">סוג המנה:</label>
                    <div class="options-group" id="meatOptionsGroup"></div>
                </div>

                <!-- תוספות -->
                <div class="form-group">
                    <label class="section-label" id="toppingsLabel">תוספות וסלטים:</label>
                    <div class="options-group" id="toppingsOptionsGroup"></div>
                </div>

                <!-- הערות -->
                <div class="form-group">
                    <label for="notes" class="section-label">הערות מיוחדות:</label>
                    <textarea id="notes" name="notes" placeholder="הערות נוספות (למשל: בלי שום, הרבה חריף וכו')"></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">שלח הזמנה</button>
            </fieldset>
        </form>
    </div>

    <!-- מסך אישור -->
    <div id="confirmationScreen">
        <h2>🎉 ההזמנה נקלטה בהצלחה!</h2>
        <p>ההזמנה נשלחה למרכז ההזמנות <strong>"LalushMobile"</strong> וצפויה להיות מוגשת עד השעה <strong>12:00</strong></p>
        <button class="btn-new-order" onclick="resetToNewOrder()">ביצוע הזמנה נוספת</button>
    </div>
</div>

<!-- חלונית ניהול נסתרת (Shift + Alt + M) -->
<div id="adminPanel">
    <h3>ממשק מנהל מערכת</h3>
    
    <div class="admin-section">
        <div class="toggle-container">
            <span>קבלת הזמנות:</span>
            <input type="checkbox" id="orderToggle">
        </div>
    </div>

    <div class="admin-section">
        <label for="adminCategorySelect">סוג האוכל הפעיל:</label>
        <select id="adminCategorySelect" onchange="onAdminCategoryChange()">
            <option value="שווארמה">שווארמה</option>
            <option value="חומוס">חומוס</option>
        </select>
    </div>

    <div class="admin-section">
        <label for="adminProviderSelect">שם המסעדה להיום:</label>
        <select id="adminProviderSelect"></select>
        <button class="btn-admin-action" onclick="saveCategoryAndProvider()">עדכן הגדרות פעילות</button>
    </div>

    <div class="admin-section">
        <label for="adminEmailInput">כתובת מייל לקבלת הקובץ המלא:</label>
        <input type="email" id="adminEmailInput" placeholder="example@gmail.com">
        <button class="btn-admin-export" id="exportBtn" onclick="exportFileToEmail()">📧 שלח ריכוז Excel במייל</button>
    </div>

    <button class="close-admin" onclick="toggleAdminPanel(false)">סגור חלונית</button>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyvm9yU7e9x_iqA5Q0eMFYwveCbDxZJybg7D3eaqqe2KroYXospNMfWLKEuPBbN2kw3/exec';

    const categoriesData = {
        "שווארמה": {
            title: "ברוכים הבאים להזמנת שווארמה!",
            image: "Sha.png",
            showBread: true,
            breadLabel: "סוג הלחם / הגשה:",
            breads: ["פיתה", "לאפה", "באגט", "צלחת"],
            meatLabel: "סוג הבשר:",
            providers: {
                "הפינה הלבנה": ["הודו", "עגל", "פרגית", "מעורב"],
                "דונר": ["עגל", "הודו", "מעורב (עגל + הודו)"]
            },
            toppingsLabel: "תוספות וסלטים:",
            toppings: ["חומוס", "טחינה", "סלט ערבי", "חריף", "חמוצים", "צ'יפס בתוך המנה", "צ'יפס בצד"]
        },
        "חומוס": {
            title: "ברוכים הבאים להזמנת חומוס!",
            image: "hummus.png",
            showBread: false,
            breadLabel: "",
            breads: [],
            meatLabel: "מנת חומוס / סלט:",
            providers: {
                "חומוס נרי שוהם": [
                    "חומוס נקי (₪36)",
                    "חומוס גרגירים (₪38)",
                    "חומוס טחינה (₪38)",
                    "חומוס פול (₪38)",
                    "חומוס מסבחה (₪38)",
                    "חומוס משולש - טחינה, פול, גרגירים (₪40)",
                    "חומוס קומפלט - טחינה, פול, גרגירים וביצה (₪43)",
                    "חומוס פטריות טריות (₪46)",
                    "חומוס חמשוקה - שקשוקה על חומוס (₪48)",
                    "חומוס שווארמה טבעונית (₪48)",
                    "סלט נרי - ירקות, חומוס, טחינה וביצה (₪44)"
                ]
            },
            toppingsLabel: "תוספות וסלטים:",
            toppings: ["ביצה קשה", "סלט אישי בצד"]
        }
    };

    const orderToggle = document.getElementById('orderToggle');
    const formFields = document.getElementById('formFields');
    const closedMessage = document.getElementById('closed-message');
    const providerSubtitle = document.getElementById('providerSubtitle');
    const mainTitle = document.getElementById('mainTitle');
    const headerImg = document.getElementById('headerImg');
    const userSelect = document.getElementById('userSelect');
    const newUserGroup = document.getElementById('newUserGroup');
    const newUserNameInput = document.getElementById('newUserName');
    const adminCategorySelect = document.getElementById('adminCategorySelect');
    const adminProviderSelect = document.getElementById('adminProviderSelect');
    const adminEmailInput = document.getElementById('adminEmailInput');
    const breadFormGroup = document.getElementById('breadFormGroup');

    let globalUsersData = {};

    function renderDynamicForm(categoryName, providerName) {
        const cat = categoriesData[categoryName] || categoriesData["שווארמה"];
        mainTitle.innerText = cat.title;
        providerSubtitle.innerText = `היום ההזמנה מגיעה מ${providerName}`;
        
        // הגדרת מקור התמונה והצגתה רק לאחר שהמידע זמין
        headerImg.src = cat.image || "Sha.png";
        headerImg.style.display = "block";

        // טיפול בשדות לחם / הגשה
        if (cat.showBread) {
            breadFormGroup.style.display = 'block';
            document.getElementById('breadLabel').innerText = cat.breadLabel;
            const breadGroup = document.getElementById('breadOptionsGroup');
            breadGroup.innerHTML = '';
            cat.breads.forEach((item, index) => {
                const req = index === 0 ? 'required' : '';
                breadGroup.innerHTML += `<label class="radio-item"><input type="radio" name="bread" value="${item}" ${req}> ${item}</label>`;
            });
        } else {
            breadFormGroup.style.display = 'none';
            document.getElementById('breadOptionsGroup').innerHTML = '';
        }

        // שדות מנה/בשר
        document.getElementById('meatLabel').innerText = cat.meatLabel;
        const meatGroup = document.getElementById('meatOptionsGroup');
        meatGroup.innerHTML = '';
        const meatsList = (cat.providers && cat.providers[providerName]) ? cat.providers[providerName] : Object.values(cat.providers)[0];
        meatsList.forEach((item, index) => {
            const req = index === 0 ? 'required' : '';
            meatGroup.innerHTML += `<label class="radio-item"><input type="radio" name="meat" value="${item}" ${req}> ${item}</label>`;
        });

        // שדות תוספות
        document.getElementById('toppingsLabel').innerText = cat.toppingsLabel;
        const toppingsGroup = document.getElementById('toppingsOptionsGroup');
        toppingsGroup.innerHTML = '';
        cat.toppings.forEach(item => {
            toppingsGroup.innerHTML += `<label class="checkbox-item"><input type="checkbox" name="toppings" value="${item}"> ${item}</label>`;
        });
    }

    function onAdminCategoryChange() {
        const catName = adminCategorySelect.value;
        const cat = categoriesData[catName];
        adminProviderSelect.innerHTML = '';
        if (cat && cat.providers) {
            Object.keys(cat.providers).forEach(prov => {
                adminProviderSelect.innerHTML += `<option value="${prov}">${prov}</option>`;
            });
        }
    }

    function updateFormUI(isOpen) {
        formFields.disabled = !isOpen;
        closedMessage.style.display = isOpen ? 'none' : 'block';
        if (!isOpen) closedMessage.innerHTML = '🚫 המערכת סגורה כרגע לקבלת הזמנות חדשות.';
        orderToggle.checked = isOpen;
    }

    function checkSystemStatus() {
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                updateFormUI(data.isOpen);
                const activeCat = data.activeCategory || "שווארמה";
                const activeProv = data.provider || "הפינה הלבנה";

                adminCategorySelect.value = activeCat;
                onAdminCategoryChange();
                adminProviderSelect.value = activeProv;

                renderDynamicForm(activeCat, activeProv);

                if (data.users) {
                    globalUsersData = data.users;
                    populateUsersDropdown(data.users);
                }
            })
            .catch(err => {
                console.error('Error fetching status:', err);
                closedMessage.innerHTML = '🚫 אירעה שגיאה בבדיקת סטטוס המערכת.';
            });
    }

    function populateUsersDropdown(users) {
        userSelect.innerHTML = `
            <option value="">-- בחר שם מהרשימה או צור חדש --</option>
            <option value="NEW_USER">+ משתמש חדש (הכנס שם חדש)</option>
        `;
        Object.keys(users).forEach(name => {
            userSelect.innerHTML += `<option value="${name}">${name}</option>`;
        });
    }

    userSelect.addEventListener('change', function() {
        const val = this.value;
        if (val === 'NEW_USER') {
            newUserGroup.style.display = 'block';
            newUserNameInput.required = true;
            resetFormOptions();
        } else if (val && globalUsersData[val]) {
            newUserGroup.style.display = 'none';
            newUserNameInput.required = false;
            newUserNameInput.value = '';
            loadUserOrder(globalUsersData[val]);
        } else {
            newUserGroup.style.display = 'none';
            newUserNameInput.required = false;
            resetFormOptions();
        }
    });

    function loadUserOrder(userData) {
        if (userData.bread) {
            const el = document.querySelector(`input[name="bread"][value="${userData.bread}"]`);
            if (el) el.checked = true;
        }
        if (userData.meat) {
            const el = document.querySelector(`input[name="meat"][value="${userData.meat}"]`);
            if (el) el.checked = true;
        }
        document.querySelectorAll('input[name="toppings"]').forEach(cb => { cb.checked = false; });
        if (userData.toppings) {
            userData.toppings.split(',').map(s => s.trim()).forEach(topping => {
                const cb = document.querySelector(`input[name="toppings"][value="${topping}"]`);
                if (cb) cb.checked = true;
            });
        }
        document.getElementById('notes').value = userData.notes || '';
    }

    function resetFormOptions() {
        document.querySelectorAll('input[name="bread"]').forEach(r => r.checked = false);
        document.querySelectorAll('input[name="meat"]').forEach(r => r.checked = false);
        document.querySelectorAll('input[name="toppings"]').forEach(cb => cb.checked = false);
        document.getElementById('notes').value = '';
    }

    orderToggle.addEventListener('change', function() {
        const isOpen = this.checked;
        updateFormUI(isOpen);
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'toggleStatus', isOpen: isOpen })
        });
    });

    function saveCategoryAndProvider() {
        const selectedCat = adminCategorySelect.value;
        const selectedProv = adminProviderSelect.value;

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                action: 'updateCategoryAndProvider', 
                category: selectedCat,
                provider: selectedProv 
            })
        }).then(() => {
            renderDynamicForm(selectedCat, selectedProv);
            alert('ההגדרות עודכנו בהצלחה!');
        });
    }

    function exportFileToEmail() {
        const targetEmail = adminEmailInput.value.trim();
        if (!targetEmail) {
            alert('נא להזין כתובת מייל תקינה לקבלת הקובץ');
            return;
        }

        const btn = document.getElementById('exportBtn');
        btn.disabled = true;
        btn.innerText = 'שולח ריכוז מלא מתוך ה-Gmail...';

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                action: 'exportSpreadsheet',
                recipientEmail: targetEmail
            })
        }).then(() => {
            alert(`קובץ ה-Excel המלא יישלח לכתובת: ${targetEmail}`);
            btn.disabled = false;
            btn.innerText = '📧 שלח ריכוז Excel במייל';
        }).catch(err => {
            alert('אירעה שגיאה בייצוא הקובץ');
            btn.disabled = false;
            btn.innerText = '📧 שלח ריכוז Excel במייל';
        });
    }

    // קיצור מנהל: Shift + Alt + M
    document.addEventListener('keydown', function(e) {
        if (e.shiftKey && e.altKey && (e.code === 'KeyM' || e.key === 'M' || e.key === 'm' || e.key === 'צ')) {
            e.preventDefault();
            toggleAdminPanel(true);
        }
    });

    function toggleAdminPanel(show) {
        document.getElementById('adminPanel').style.display = show ? 'block' : 'none';
    }

    document.getElementById('shawarmaForm').addEventListener('submit', function(e) {
        e.preventDefault();

        let finalName = userSelect.value;
        if (finalName === 'NEW_USER') {
            finalName = newUserNameInput.value.trim();
        }

        if (!finalName) {
            alert('נא לבחור או להזין שם מלא');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'שולח הזמנה...';

        const formData = new FormData(this);
        const selectedToppings = [];
        document.querySelectorAll('input[name="toppings"]:checked').forEach(el => {
            selectedToppings.push(el.value);
        });

        const orderData = {
            name: finalName,
            bread: formData.get('bread') || 'ללא',
            meat: formData.get('meat'),
            toppings: selectedToppings.join(', '),
            notes: formData.get('notes') || '',
            drink: 'ללא שתייה'
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
        })
        .then(() => {
            document.getElementById('shawarmaForm').reset();
            newUserGroup.style.display = 'none';
            document.getElementById('formScreen').style.display = 'none';
            document.getElementById('confirmationScreen').style.display = 'block';
            
            submitBtn.disabled = false;
            submitBtn.innerText = 'שלח הזמנה';
        })
        .catch(error => {
            console.error('Error:', error);
            alert('אירעה שגיאה בשליחת ההזמנה');
            submitBtn.disabled = false;
            submitBtn.innerText = 'שלח הזמנה';
        });
    });

    function resetToNewOrder() {
        document.getElementById('confirmationScreen').style.display = 'none';
        document.getElementById('formScreen').style.display = 'block';
        headerImg.style.display = "none";
        checkSystemStatus();
    }

    checkSystemStatus();
</script>

</body>
</html>
